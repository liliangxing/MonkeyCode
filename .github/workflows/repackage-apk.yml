name: Repackage APK with Different Package Name

on:
  workflow_dispatch:

jobs:
  repackage:
    runs-on: ubuntu-latest
    steps:
      - name: Download original APK
        run: |
          curl -sL -o monkeycode.apk \
            "https://github.com/chaitin/MonkeyCode/releases/download/v26072101/MonkeyCode-android.apk"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool
        run: |
          curl -sL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar"

      - name: Decompile APK
        run: |
          java -jar apktool.jar d -f monkeycode.apk -o decompiled

      - name: Change package name
        run: |
          OLD_PKG="com.chaitin.baizhi.monkeycode"
          NEW_PKG="com.chaitin.baizhi.monkeycode2"
          OLD_PKG_PATH="com/chaitin/baizhi/monkeycode"
          NEW_PKG_PATH="com/chaitin/baizhi/monkeycode2"

          echo "Changing package name: $OLD_PKG -> $NEW_PKG"

          # 1. AndroidManifest.xml
          sed -i "s|${OLD_PKG//./\\.}|$NEW_PKG|g" decompiled/AndroidManifest.xml

          # 2. Smali file content - slash form only (sed . matches / in regex!)
          find decompiled/smali* -type f -name "*.smali" | while read f; do
            sed -i "s|${OLD_PKG_PATH}|${NEW_PKG_PATH}|g" "$f"
          done

          # Debug: show BuildConfig.smali after replacement
          echo "=== BuildConfig.smali ==="
          find decompiled/smali* -path "*/BuildConfig.smali" | head -3 | while read f; do
            echo "--- $f ---"
            head -5 "$f"
          done

          # 3. Move smali source directories to new package path
          for smali_dir in decompiled/smali*; do
            if [ -d "$smali_dir/$OLD_PKG_PATH" ]; then
              mkdir -p "$(dirname "$smali_dir/$NEW_PKG_PATH")"
              mv "$smali_dir/$OLD_PKG_PATH" "$smali_dir/$NEW_PKG_PATH"
            fi
          done

          # 4. Resources - escape dots in pattern
          find decompiled/res -type f | while read f; do
            sed -i "s|${OLD_PKG//./\\.}|$NEW_PKG|g" "$f" 2>/dev/null || true
          done

          echo "Package name change complete"

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled -o monkeycode-repackaged.apk

      - name: Generate keystore and sign
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=monkeycode, OU=Dev, O=MonkeyCode, L=Beijing, ST=Beijing, C=CN"

          curl -sL -o uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"

          java -jar uber-apk-signer.jar \
            --apks monkeycode-repackaged.apk \
            --ks release.keystore \
            --ksAlias release \
            --ksKeyPass android \
            --ksPass android

      - name: Upload repackaged APK
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyCode-repackaged
          path: monkeycode-repackaged-aligned-signed.apk
